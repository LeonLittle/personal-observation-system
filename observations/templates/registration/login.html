<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 · 个人观察助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 244, 214, 0.9), transparent 32%),
                linear-gradient(135deg, #f7f3ea 0%, #eef3f7 100%);
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.76);
            box-shadow: 0 20px 60px rgba(80, 70, 50, 0.12);
        }

        .title {
            margin: 0;
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 28px;
            color: #7a756b;
            font-size: 14px;
        }

        .form-label {
            display: block;
            margin-top: 16px;
            margin-bottom: 8px;
            color: #7a756b;
            font-size: 14px;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 18px;
            padding: 15px 16px;
            font-size: 15px;
            background: rgba(246, 242, 233, 0.88);
            font-family: inherit;
        }

        .error {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(255, 220, 220, 0.7);
            color: #8a3a3a;
            font-size: 14px;
            line-height: 1.6;
        }

        .button {
            margin-top: 22px;
            width: 100%;
            border: none;
            border-radius: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(80, 70, 50, 0.08);
        }

        .note {
            margin-top: 18px;
            color: #8b8376;
            font-size: 13px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1 class="title">个人观察助手</h1>
        <div class="subtitle">先确认是你，再进入今天。</div>

        {% if form.errors %}
            <div class="error">
                用户名或密码不正确，请重新输入。
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label class="form-label">用户名</label>
            {{ form.username }}

            <label class="form-label">密码</label>
            {{ form.password }}

            <button class="button" type="submit">
                登录
            </button>
        </form>

        <p class="note">
            这是你的私人观察空间。<br>
            登录后，才可以查看今日行动、今日状态和每周观察。
        </p>
    </main>
</body>
</html>
