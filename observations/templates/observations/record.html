{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'observations/base.css' %}">

    <style>
        /*
            今日状态页独有样式。

            公共样式已经交给 base.css：
            - *
            - body
            - page
            - system-name
            - system-subtitle
            - top-nav
            - top-nav a
            - top-nav a.active
            - section-title

            所以这里不要再重复写这些公共样式。
        */

        /*
            日期行：
            当前 record.html 里日期显示是注释状态。
            这段先保留，后续如果恢复日期显示可以继续用。
        */
        .date-row {
            margin-top: 32px;
            font-size: 20px;
            font-weight: 600;
            color: #2f2d29;
        }

        /*
            今日状态记录卡片：
            只属于 record 页面。
        */
        .record-card {
            margin-top: 24px;
            padding: 26px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(80, 70, 50, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        /*
            record-card 里面的标题需要比普通 section-title 稍微大一点。
            所以这里单独覆盖 base.css 的公共标题样式。
        */
        .record-card .section-title {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 20px;
        }

        /*
            表单标签：
            例如：今天的心情、今天的精力分、今日总结。
        */
        .form-label {
            display: block;
            margin-bottom: 8px;
            margin-top: 16px;
            font-size: 14px;
            color: #7a756b;
        }

        .form-label:first-of-type {
            margin-top: 0;
        }

        /*
            输入框和文本框：
            只属于今日状态页。
        */
        .record-input,
        .record-textarea {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 18px;
            padding: 15px 16px;
            font-size: 15px;
            color: #33302b;
            background: rgba(246, 242, 233, 0.75);
            font-family: inherit;
        }

        /*
            今日总结文本框。
        */
        .record-textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.7;
        }

        /*
            保存按钮：
            这个按钮目前只属于今日状态页，
            所以暂时不放进 base.css。
        */
        .save-button {
            margin-top: 20px;
            width: 100%;
            border: none;
            border-radius: 20px;
            padding: 16px 18px;
            font-size: 15px;
            font-weight: 650;
            color: #3f372d;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 10px 28px rgba(80, 70, 50, 0.08);
            cursor: pointer;
        }

        /*
            底部提示文字。
        */
        .note {
            margin-top: 20px;
            color: #8b8376;
            line-height: 1.7;
            font-size: 14px;
        }

        /*
            手机端：
            这里只保留今日状态页独有的手机端样式。
            page、system-name、top-nav 已经交给 base.css。
        */
        @media (max-width: 520px) {
            .record-card {
                padding: 22px;
                border-radius: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <header>
            <h1 class="system-name">今日状态</h1>
            <div class="system-subtitle">Have a nice day</div>
            <!-- <div class="date-row">
                {{ date_text }} · {{ weekday_text }}
            </div> -->

            <nav class="top-nav">
                <a href="{% url 'home' %}">首页</a>
                <a href="{% url 'task_list' %}">行动</a>
                <a class="active" href="{% url 'record' %}">状态</a>
                <a href="{% url 'habits' %}">习惯</a>
                <a href="{% url 'history' %}">观察</a>
            </nav>

            


        </header>

        <section class="record-card">
            <h2 class="section-title">记录今天真实的状态</h2>

            <form method="post">
                {% csrf_token %}

                <label class="form-label">今天的心情</label>
                <input
                    class="record-input"
                    type="text"
                    name="mood"
                    placeholder="例如：平稳、疲惫、焦躁、充实"
                    value="{{ today_record.mood }}"
                >

                <label class="form-label">今天的精力分</label>
                <input
                    class="record-input"
                    type="number"
                    name="energy"
                    min="1"
                    max="10"
                    placeholder="1-10"
                    value="{{ today_record.energy|default_if_none:'' }}"
                >

                <label class="form-label">今日总结</label>
                <textarea
                    class="record-textarea"
                    name="summary"
                    placeholder="今天真实发生了什么？"
                >{{ today_record.summary }}</textarea>

                <button class="save-button" type="submit">
                    保存今日状态
                </button>
            </form>

            <p class="note">
                这里不用写得完美。<br>
                只要把今天真实出现过的状态留下来，就已经有价值。
            </p>
        </section>
    </main>
</body>
</html>
