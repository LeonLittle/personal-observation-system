<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 244, 214, 0.9), transparent 32%),
                linear-gradient(135deg, #f7f3ea 0%, #eef3f7 100%);
            color: #222;
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .system-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0;
        }

        .system-subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #7a756b;
        }

        .date-row {
            margin-top: 32px;
            font-size: 20px;
            font-weight: 600;
            color: #2f2d29;
        }

        .record-card {
            margin-top: 24px;
            padding: 26px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(80, 70, 50, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 20px;
            font-weight: 700;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            margin-top: 16px;
            font-size: 14px;
            color: #7a756b;
        }

        .form-label:first-of-type {
            margin-top: 0;
        }

        .record-input,
        .record-textarea {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 18px;
            padding: 15px 16px;
            font-size: 15px;
            color: #33302b;
            background: rgba(246, 242, 233, 0.75);
            font-family: inherit;
        }

        .record-textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.7;
        }

        .save-button {
            margin-top: 20px;
            width: 100%;
            border: none;
            border-radius: 20px;
            padding: 16px 18px;
            font-size: 15px;
            font-weight: 650;
            color: #3f372d;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 10px 28px rgba(80, 70, 50, 0.08);
            cursor: pointer;
        }

        .note {
            margin-top: 20px;
            color: #8b8376;
            line-height: 1.7;
            font-size: 14px;
        }

        .top-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 14px 0 16px;
            padding: 6px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.58);
            box-shadow: 0 10px 26px rgba(80, 70, 50, 0.06);
        }

        .top-nav a {
            display: block;
            padding: 9px 4px;
            border-radius: 14px;
            color: #7a756b;
            font-size: 13px;
            font-weight: 650;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
        }

        .top-nav a.active {
            color: #3f372d;
            background: rgba(246, 242, 233, 0.92);
        }



        @media (max-width: 520px) {
            .page {
                padding: 26px 16px 40px;
            }

            .system-name {
                font-size: 25px;
            }

            .record-card {
                padding: 22px;
                border-radius: 24px;
            }

            .top-nav {
                grid-template-columns: repeat(5, 1fr);
                gap: 5px;
                margin: 12px 0 14px;
                padding: 5px;
                border-radius: 16px;
            }

            .top-nav a {
                padding: 8px 2px;
                font-size: 12px;
                border-radius: 12px;
            }

        }
    </style>
</head>

<body>
    <main class="page">

        <header>
            <h1 class="system-name">今日状态</h1>
            <div class="system-subtitle">Have a nice day</div>
            <!-- <div class="date-row">
                {{ date_text }} · {{ weekday_text }}
            </div> -->

            <nav class="top-nav">
                <a href="{% url 'home' %}">首页</a>
                <a href="{% url 'task_list' %}">行动</a>
                <a class="active" href="{% url 'record' %}">状态</a>
                <a href="{% url 'habits' %}">习惯</a>
                <a href="{% url 'history' %}">观察</a>
            </nav>

            


        </header>

        <section class="record-card">
            <h2 class="section-title">记录今天真实的状态</h2>

            <form method="post">
                {% csrf_token %}

                <label class="form-label">今天的心情</label>
                <input
                    class="record-input"
                    type="text"
                    name="mood"
                    placeholder="例如：平稳、疲惫、焦躁、充实"
                    value="{{ today_record.mood }}"
                >

                <label class="form-label">今天的精力分</label>
                <input
                    class="record-input"
                    type="number"
                    name="energy"
                    min="1"
                    max="10"
                    placeholder="1-10"
                    value="{{ today_record.energy|default_if_none:'' }}"
                >

                <label class="form-label">今日总结</label>
                <textarea
                    class="record-textarea"
                    name="summary"
                    placeholder="今天真实发生了什么？"
                >{{ today_record.summary }}</textarea>

                <button class="save-button" type="submit">
                    保存今日状态
                </button>
            </form>

            <p class="note">
                这里不用写得完美。<br>
                只要把今天真实出现过的状态留下来，就已经有价值。
            </p>
        </section>
    </main>
</body>
</html>
